name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # xgboost and lightgbm ship manylinux wheels that bundle OpenMP,
      # so no libomp-dev apt step is needed on ubuntu-latest.
      # (On macOS runners you'd need `brew install libomp` + DYLD_FALLBACK_LIBRARY_PATH,
      # but the ubuntu manylinux wheels are self-contained.)

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        # Many tests guard untracked modules with pytest.importorskip(), so
        # the suite passes green without model.py, features.py, etc.
        # The live model pkl (models/*.pkl) is gitignored; tests that need it
        # skip automatically when it's absent.
        run: python -m pytest tests/ -q
